use_default_settings:
  engines:
    keep_only: [bing, 360search]
general:
  instance_name: "Domel Research · Local Search"
search:
  formats: [html, json]
  safe_search: 1
server:
  limiter: false
  public_instance: false
  image_proxy: false
engines:
  - name: bing
    engine: bing
    base_url: https://cn.bing.com
    timeout: 12.0
    disabled: false
  - name: 360search
    engine: 360search
    timeout: 20.0
    disabled: false
outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
