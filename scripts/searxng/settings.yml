use_default_settings:
  engines:
    keep_only: [google, bing, duckduckgo]
general:
  instance_name: "Domel Research · Local Search"
search:
  formats: [html, json]
  safe_search: 1
server:
  limiter: false
  public_instance: false
  image_proxy: false
engines:
  - name: google
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
  # Optional outgoing.proxies is added on first install by SEARXNG_PROXY.
